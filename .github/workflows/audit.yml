# Workflow réutilisable : un autre dépôt l'appelle pour s'auditer à chaque push.
# Exemple dans le README, section « Dans la CI d'un autre dépôt ».
name: Audit des secrets

on:
  workflow_call:
    inputs:
      min-severity:
        description: Gravité à partir de laquelle la CI échoue (low, medium, high)
        type: string
        default: medium
      ignore:
        description: Chemins à ignorer, séparés par des espaces (motifs fnmatch)
        type: string
        default: ""
      version:
        description: Branche ou tag de secrets-audit à utiliser
        type: string
        default: main
      sarif:
        description: Envoyer aussi le rapport SARIF à l'analyse du code de GitHub
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    name: Audit des secrets
    runs-on: ubuntu-latest
    # Pas de permission ajoutée ici : le dépôt appelant accorde security-events: write
    # seulement s'il demande l'envoi SARIF, les autres appels restent en lecture seule.
    steps:
      - name: Dépôt à auditer
        uses: actions/checkout@v7
        with:
          path: depot
          # Historique complet : l'audit cherche aussi les fichiers sensibles déjà supprimés
          fetch-depth: 0
          persist-credentials: false
      - name: secrets-audit
        uses: actions/checkout@v7
        with:
          repository: Remiverhaeghe/secrets-audit
          ref: ${{ inputs.version }}
          path: outil
          persist-credentials: false
      - name: Audit
        working-directory: depot
        env:
          MIN_SEVERITY: ${{ inputs.min-severity }}
          IGNORE: ${{ inputs.ignore }}
        # Entrées passées par l'environnement, jamais collées dans le script
        run: |
          vArgs=(--min-severity "$MIN_SEVERITY")
          read -ra vPatterns <<< "$IGNORE"
          for vPattern in "${vPatterns[@]}"; do vArgs+=(--ignore "$vPattern"); done
          PYTHONPATH=../outil python3 -m secrets_audit . "${vArgs[@]}"
      - name: Rapport SARIF
        if: ${{ always() && inputs.sarif }}
        working-directory: depot
        env:
          IGNORE: ${{ inputs.ignore }}
        # Code de sortie ignoré : c'est l'étape « Audit » qui décide de l'échec
        run: |
          vArgs=(--sarif --min-severity low)
          read -ra vPatterns <<< "$IGNORE"
          for vPattern in "${vPatterns[@]}"; do vArgs+=(--ignore "$vPattern"); done
          PYTHONPATH=../outil python3 -m secrets_audit . "${vArgs[@]}" > ../secrets-audit.sarif || true
      - name: Envoi à l'analyse du code
        if: ${{ always() && inputs.sarif }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: secrets-audit.sarif
          category: secrets-audit
